<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY WEB</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: rgba(22, 27, 34, 0.85);
      --accent: #58a6ff;
      --accent-purple: #bc8cff;
      --text: #c9d1d9;
      --text-bright: #f0f6fc;
      --border: rgba(48, 54, 61, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2.5rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Decoraciones visuales de fondo (luces difusas estilo GitHub) */
    .glow-1 {
      position: absolute;
      top: -100px;
      left: -100px;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(88, 166, 255, 0.25), transparent 70%);
      border-radius: 50%;
      filter: blur(60px);
      z-index: 0;
    }

    .glow-2 {
      position: absolute;
      bottom: -100px;
      right: -100px;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(188, 140, 255, 0.2), transparent 70%);
      border-radius: 50%;
      filter: blur(70px);
      z-index: 0;
    }

    /* Tarjeta principal con efecto de desenfoque de cristal (más amplia) */
    .container {
      position: relative;
      z-index: 1;
      max-width: 1050px;
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
    }

    /* Encabezado */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .badge {
      display: inline-block;
      padding: 0.45rem 1.2rem;
      background: rgba(88, 166, 255, 0.12);
      color: var(--accent);
      border: 1px solid rgba(88, 166, 255, 0.3);
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Cuadrícula para las dos tarjetas con fotos (cuadros más anchos) */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 2.2rem;
    }

    .card {
      background: rgba(13, 17, 23, 0.7);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: var(--accent);
      box-shadow: 0 12px 28px rgba(88, 166, 255, 0.15);
    }

    /* Altura de las fotos aumentada para que se vean más grandes */
    .image-wrapper {
      width: 100%;
      height: 320px;
      overflow: hidden;
      background: #161b22;
    }

    .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .card:hover .image-wrapper img {
      transform: scale(1.05);
    }

    .card-content {
      padding: 1.4rem;
      text-align: center;
    }

    .card-content h3 {
      color: var(--text-bright);
      font-size: 1.3rem;
    }
  </style>
</head>
<body>

  <!-- Elementos luminosos decorativos -->
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="container">
    <header>
      <span class="badge">VENTA DE IPHONES</span>
    </header>

    <div class="gallery">
      <!-- Tarjeta 1 -->
      <div class="card">
        <div class="image-wrapper">
          <img src="img/foto1.jpg" alt="Iphone 11">
        </div>
        <div class="card-content">
          <h3>Iphone 11</h3>
        </div>
      </div>

      <!-- Tarjeta 2 -->
      <div class="card">
        <div class="image-wrapper">
          <img src="img/foto2.jpg" alt="Iphone 17">
        </div>
        <div class="card-content">
          <h3>Iphone 17</h3>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
