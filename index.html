<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY WEB</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: rgba(22, 27, 34, 0.85);
      --accent: #58a6ff;
      --accent-purple: #bc8cff;
      --text: #c9d1d9;
      --text-bright: #f0f6fc;
      --border: rgba(48, 54, 61, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 3rem 1.5rem;
      position: relative;
      overflow-x: auto; /* Permite scroll horizontal si la pantalla es menor a los cuadros */
    }

    /* Decoraciones visuales de fondo */
    .glow-1 {
      position: absolute;
      top: -150px;
      left: -150px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(88, 166, 255, 0.25), transparent 70%);
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
    }

    .glow-2 {
      position: absolute;
      bottom: -150px;
      right: -150px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(188, 140, 255, 0.2), transparent 70%);
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
    }

    /* Contenedor adaptado para albergar dos bloques de 1000px */
    .container {
      position: relative;
      z-index: 1;
      max-width: 2250px;
      width: fit-content;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 3.5rem;
      box-shadow: 0 25px 55px rgba(0, 0, 0, 0.55);
    }

    header {
      text-align: center;
      margin-bottom: 3rem;
    }

    .badge {
      display: inline-block;
      padding: 0.6rem 1.6rem;
      background: rgba(88, 166, 255, 0.12);
      color: var(--accent);
      border: 1px solid rgba(88, 166, 255, 0.3);
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.8px;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 3rem;
    }

    /* Cuadro con dimensiones exactas de 1000x1000 px */
    .card {
      width: 1000px;
      height: 1000px;
      background: rgba(13, 17, 23, 0.7);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: var(--accent);
      box-shadow: 0 16px 36px rgba(88, 166, 255, 0.2);
    }

    /* Ocupa todo el espacio menos el texto */
    .image-wrapper {
      width: 100%;
      height: 880px;
      overflow: hidden;
      background: #161b22;
    }

    .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .card:hover .image-wrapper img {
      transform: scale(1.03);
    }

    /* Barra inferior con el título (120px) para completar los 1000px exactos */
    .card-content {
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: rgba(13, 17, 23, 0.95);
      border-top: 1px solid var(--border);
    }

    .card-content h3 {
      color: var(--text-bright);
      font-size: 2rem;
    }
  </style>
</head>
<body>

  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="container">
    <header>
      <span class="badge">VENTA DE IPHONES</span>
    </header>

    <div class="gallery">
      <!-- Tarjeta 1 (1000x1000) -->
      <div class="card">
        <div class="image-wrapper">
          <img src="img/foto1.jpg" alt="Iphone 11">
        </div>
        <div class="card-content">
          <h3>Iphone 11</h3>
        </div>
      </div>

      <!-- Tarjeta 2 (1000x1000) -->
      <div class="card">
        <div class="image-wrapper">
          <img src="img/foto2.jpg" alt="Iphone 17">
        </div>
        <div class="card-content">
          <h3>Iphone 17</h3>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
