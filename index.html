<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY WEB</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: rgba(22, 27, 34, 0.85);
      --accent: #58a6ff;
      --accent-purple: #bc8cff;
      --text: #c9d1d9;
      --text-bright: #f0f6fc;
      --border: rgba(48, 54, 61, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2.5rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Decoraciones visuales de fondo */
    .glow-1 {
      position: absolute;
      top: -100px;
      left: -100px;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(88, 166, 255, 0.25), transparent 70%);
      border-radius: 50%;
      filter: blur(70px);
      z-index: 0;
    }

    .glow-2 {
      position: absolute;
      bottom: -100px;
      right: -100px;
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(188, 140, 255, 0.2), transparent 70%);
      border-radius: 50%;
      filter: blur(70px);
      z-index: 0;
    }

    /* Contenedor principal que aloja cómodamente los dos bloques */
    .container {
      position: relative;
      z-index: 1;
      max-width: 1250px;
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .badge {
      display: inline-block;
      padding: 0.5rem 1.4rem;
      background: rgba(88, 166, 255, 0.12);
      color: var(--accent);
      border: 1px solid rgba(88, 166, 255, 0.3);
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.6px;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2.5rem;
    }

    /* Cuadros cuadrados de 520x520 px */
    .card {
      width: 520px;
      height: 520px;
      background: rgba(13, 17, 23, 0.7);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: var(--accent);
      box-shadow: 0 14px 30px rgba(88, 166, 255, 0.18);
    }

    /* Foto proporcional dentro del cuadro */
    .image-wrapper {
      width: 100%;
      height: 440px;
      overflow: hidden;
      background: #161b22;
    }

    .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .card:hover .image-wrapper img {
      transform: scale(1.04);
    }

    /* Pie de la tarjeta (80px) para completar los 520px exactos */
    .card-content {
      height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.8rem;
      background: rgba(13, 17, 23, 0.95);
      border-top: 1px solid var(--border);
    }

    .card-content h3 {
      color: var(--text-bright);
      font-size: 1.4rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="container">
    <header>
      <span class="badge">VENTA DE IPHONES</span>
    </header>

    <div class="gallery">
      <!-- Tarjeta 1 (520x520) -->
      <div class="card">
        <div class="image-wrapper">
          <img src="img/foto1.jpg" alt="Iphone 11">
        </div>
        <div class="card-content">
          <h3>Iphone 11</h3>
        </div>
      </div>

      <!-- Tarjeta 2 (520x520) -->
      <div class="card">
        <div class="image-wrapper">
          <img src="img/foto2.jpg" alt="Iphone 17">
        </div>
        <div class="card-content">
          <h3>Iphone 17</h3>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
